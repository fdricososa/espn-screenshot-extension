<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ESPN Capture Viewer</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; margin: 0;}
        header { width: 100%; height: 60px; line-height: 60px; position: fixed !important; background-color: #00033c; color: white; display: flex; align-items: center; justify-content: end;}
        .bar { display: flex; gap: 8px; align-items: center; margin-right: 12px; }
        button { padding: 6px 12px; }
        img { display: block; box-shadow: 0 0 10px rgba(0,0,0,.1) }
        .zoom-in {cursor: zoom-in; max-width: 100% !important; max-height: 100%;}
        .zoom-out {cursor: zoom-out; max-width: none !important; max-height: none;}
        .preview-wrap { display: flex; justify-content: center; align-items: center; padding-top: 60px; min-width: 100%;}
    </style>
  </head>
  <body>
    <header class="header">
        <div class="bar">
            <button id="copyBtn">Copy</button>
            <button id="downloadBtn">Download</button>
        </div>
    </header>
    <div class="preview-wrap">
        <img id="img" class="zoom-in" alt="capture"/>
    </div>
    <script src="viewer.js"></script>
  </body>
</html>
